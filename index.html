<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Wedding Gallery</title>

<link rel="stylesheet" href="style.css">

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/lightgallery@2.8.1/css/lightgallery-bundle.min.css">

</head>

<body>

<header class="hero">
    <h1 id="title">Wedding Gallery</h1>
    <p id="subtitle"></p>
</header>

<div id="gallery" class="gallery"></div>

<script src="https://cdn.jsdelivr.net/npm/lightgallery@2.8.1/lightgallery.min.js"></script>

<script>

fetch("config.json")
.then(r=>r.json())
.then(cfg=>{

    document.getElementById("title").textContent=cfg.title;
    document.getElementById("subtitle").textContent=cfg.date;

    const gallery=document.getElementById("gallery");

    for(let i=1;i<=131;i++){

        const file=images/mm (${i}).JPG;

        gallery.innerHTML+=
        <a href="${file}">
            <img loading="lazy" src="${file}" alt="">
        </a>
        ;

    }

    lightGallery(gallery,{
        selector:"a"
    });

});

</script>

</body>
</html>
